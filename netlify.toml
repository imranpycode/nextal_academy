# Netlify configuration for Nextal Academy (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — all routes serve index.html so React Router handles them client-side
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache immutable assets (JS/CSS bundles with hashed names) for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache public images for 30 days
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
