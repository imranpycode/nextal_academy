<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Editing Course in Nagercoil | Nextal Academy</title>
    <meta name="description" content="Master professional video editing at Nextal Academy Nagercoil. Hands-on training in Premiere Pro, After Effects, AI video tools, motion graphics, and live portfolio projects." />

    <!-- DNS prefetch for external hosts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preconnect to speed up Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload hero background and loading logo so they appear instantly -->
    <link rel="preload" as="image" href="/first_bg.webp" />
    <link rel="preload" as="image" href="/academy_logo.webp" />

    <!-- Google Fonts: load only needed weights, swap to prevent FOIT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Inline critical above-fold CSS to prevent render-blocking -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{scroll-behavior:smooth;font-size:16px}
      body{font-family:'Outfit',sans-serif;background:#ffffff;color:#1a1a2e;overflow-x:clip;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh}
      /* Reserve space for header to prevent CLS */
      .app > header{height:72px}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
